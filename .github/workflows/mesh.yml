name: Verify Profession Mesh foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mesh-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
